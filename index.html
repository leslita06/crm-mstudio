<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CRM Mstudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#1B2B6B;--teal:#2ECFBE;--teal-d:#12A697;--bleu:#2563EB;--cyan:#4DA6D8;--bg:#EEF4F8;--card:#fff;--txt:#14213D;--muted:#6B7A99;--line:#DCE4EE;--wa:#25D366;--li:#0A66C2}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font:14px/1.45 Inter,Poppins,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h1,h2,h3,.kpi b,.gate-t{font-family:Poppins,Inter,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--bleu);text-decoration:none}a:hover{text-decoration:underline}button{font:inherit;cursor:pointer}
#gate{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:50;overflow:hidden}
#gate .arcs{position:absolute;right:-18vmin;bottom:-22vmin;width:90vmin;height:90vmin;border-radius:50%;background:repeating-radial-gradient(circle at center,transparent 0 9vmin,rgba(46,207,190,.35) 9vmin 9.6vmin);opacity:.9}
#gate .arcs2{position:absolute;left:-30vmin;top:-30vmin;width:70vmin;height:70vmin;border-radius:50%;background:repeating-radial-gradient(circle at center,transparent 0 7vmin,rgba(77,166,216,.28) 7vmin 7.5vmin)}
#gate .box{position:relative;background:#fff;border-radius:18px;padding:34px 30px 28px;width:min(430px,92vw);box-shadow:0 24px 70px rgba(0,0,0,.4)}
#gate .logo{height:44px;display:block;margin:0 auto 18px}
#gate .gate-t{margin:0 0 2px;font-size:24px;color:var(--navy);font-weight:600;text-align:center}
#gate p{margin:0 0 18px;color:var(--muted);text-align:center}
#gate label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:10px 0 4px}
#gate input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit}
#gate input:focus{outline:2px solid var(--teal);border-color:transparent}
#gate button{margin-top:16px;width:100%;padding:13px;border:0;border-radius:10px;background:linear-gradient(90deg,var(--teal),var(--bleu));color:#fff;font-weight:600;font-size:15px;font-family:Poppins,Inter,sans-serif}
#gate .err{color:#c0392b;margin-top:10px;min-height:20px;text-align:center}
#gate label.rem{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13px;color:var(--txt);margin:12px 0 0}#gate label.rem input{width:auto;accent-color:var(--teal)}
header .tabs button.out{margin-left:10px;background:transparent;border:0;color:var(--muted);font-size:12px;padding:6px 4px;font-weight:400}header .tabs button.out:hover{color:var(--navy);text-decoration:underline}
header{background:#fff;color:var(--txt);padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20;border-bottom:3px solid var(--teal);box-shadow:0 2px 12px rgba(27,43,107,.06)}
header .brand{display:flex;align-items:center;gap:12px}header .brand img{height:30px}
header h1{font-size:18px;margin:0;color:var(--navy);font-weight:600}header h1 small{font-weight:400;color:var(--muted);margin-left:8px;font-size:13px;font-family:Inter,sans-serif}
header input{flex:1;min-width:220px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);font-size:15px;background:var(--bg);font-family:inherit}
header input:focus{outline:2px solid var(--teal);border-color:transparent}
header .tabs button{background:transparent;border:1px solid var(--line);color:var(--navy);padding:7px 14px;border-radius:999px;margin-left:6px;font-weight:500}
header .tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
main{display:grid;grid-template-columns:280px 1fr;gap:0;min-height:calc(100vh - 58px)}main.one{grid-template-columns:1fr}
aside{background:var(--card);border-right:1px solid var(--line);padding:14px 16px 40px;overflow:auto;max-height:calc(100vh - 58px);position:sticky;top:58px}
aside h3{margin:16px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
aside label{display:flex;align-items:center;gap:8px;padding:3px 2px;cursor:pointer;font-size:13px}
aside label span.n{margin-left:auto;color:var(--muted);font-size:12px}
aside input[type=checkbox]{accent-color:var(--teal)}
aside .reset{width:100%;margin-top:12px;padding:8px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--navy)}
section#liste{padding:14px 18px 60px;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;align-items:center}
.chips .lab{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-right:4px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--navy);display:inline-flex;gap:6px;align-items:center}
.chip b{font-weight:600;color:var(--muted)}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}.chip.on b{color:rgba(255,255,255,.75)}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.bar .cnt{font-weight:600;color:var(--navy)}.bar button{padding:7px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--navy)}
.bar button.prim{background:var(--teal-d);color:#fff;border-color:var(--teal-d)}.bar button:disabled{opacity:.45;cursor:default}
.bar select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-family:inherit}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:1180px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
th{background:#F5F8FC;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);position:sticky;top:0;cursor:pointer;font-weight:600}
th.ck,td.ck{width:34px;max-width:34px;padding-right:0}td.ck input,th.ck input{accent-color:var(--teal)}
tbody tr{cursor:pointer}tbody tr:hover{background:#F2F8FF}tbody tr.sel{background:#E9FBF8}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;background:#E4F9F5;color:#0B6E62;font-weight:500}
.tag.src{background:#EEF1F7;color:#3D4A6B;margin-right:3px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:500;color:#fff}
.pill.wa{background:var(--wa)}.pill.li{background:var(--li)}.pill svg{width:12px;height:12px;fill:#fff}
td.mail a{color:var(--bleu)}
.more{display:block;margin:14px auto;padding:9px 16px;border:1px solid var(--line);background:#fff;border-radius:9px;color:var(--navy)}
#fiche{position:fixed;top:0;right:0;height:100vh;width:min(580px,100vw);background:#fff;box-shadow:-10px 0 40px rgba(0,0,0,.18);transform:translateX(105%);transition:transform .2s;z-index:30;overflow:auto;padding:22px 24px 50px}
#fiche.on{transform:none}#fiche .x{position:absolute;top:12px;right:14px;border:0;background:var(--bg);border-radius:8px;padding:6px 10px;color:var(--navy)}
#fiche h2{margin:6px 0 2px;font-size:21px;color:var(--navy)}#fiche .sub{color:var(--muted);margin-bottom:14px}
#fiche .actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}#fiche .actions a{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:9px;color:#fff;font-weight:500;font-size:13px}
#fiche .actions a.m{background:var(--bleu)}#fiche .actions a.w{background:var(--wa)}#fiche .actions a.l{background:var(--li)}#fiche .actions svg{width:14px;height:14px;fill:#fff}
#fiche dl{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:0}#fiche dt{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding-top:3px}#fiche dd{margin:0;word-break:break-word}
#fiche .head{display:flex;gap:14px;align-items:center;margin:4px 0 14px}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-family:Poppins,Inter,sans-serif;font-size:15px;background:linear-gradient(135deg,var(--teal),var(--bleu))}
.av.s{width:28px;height:28px;font-size:11px;margin-right:8px;vertical-align:middle}
td.nom{display:flex;align-items:center}td.nom b{font-weight:600}
#fiche .card{padding:12px 14px;margin-bottom:14px}
#fiche h3.sec{margin:18px 0 10px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.hist{position:relative;margin:0;padding:0 0 0 22px;list-style:none;border-left:2px solid var(--line)}
.hist li{position:relative;margin:0 0 14px;padding-left:6px}
.hist li:before{content:"";position:absolute;left:-29px;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--teal)}
.hist li.luma:before{border-color:#7C3AED}.hist li.gmail:before{border-color:var(--bleu)}.hist li.pj:before{border-color:var(--cyan)}.hist li.drive:before{border-color:var(--teal)}
.hist .d{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.hist .t{display:block;font-weight:500;margin:2px 0}.hist .t a{color:var(--navy)}
.hist .st{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--bg);color:var(--muted);margin-left:6px}
tbody tr:nth-child(even){background:#FAFBFD}
#stats{padding:18px 22px 60px;display:none}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.kpi .card{position:relative;overflow:hidden;border:0;background:linear-gradient(135deg,var(--navy),#23378A);color:#fff}
.kpi .card:before{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:repeating-radial-gradient(circle at center,transparent 0 12px,rgba(46,207,190,.45) 12px 15px)}
.kpi .card b{display:block;font-size:30px;font-weight:600;line-height:1.1;position:relative}.kpi .card span{color:rgba(255,255,255,.8);font-size:12px;position:relative}
.kpi .card.light{background:#fff;color:var(--navy);border:1px solid var(--line)}.kpi .card.light span{color:var(--muted)}.kpi .card.light:before{background:repeating-radial-gradient(circle at center,transparent 0 12px,rgba(46,207,190,.25) 12px 15px)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0;overflow:hidden}.card h3{margin:0 0 12px;font-size:14px;color:var(--navy);font-weight:600}
.card .sub{color:var(--muted);font-size:12px;margin:-8px 0 12px}
.row{display:grid;grid-template-columns:1fr;gap:3px;margin:7px 0;font-size:13px}
.row .b{height:9px;background:#EDF1F7;border-radius:6px;overflow:hidden}.row .b i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--teal),var(--bleu))}
.row .b i.g{background:#C9D2E0}
.row{min-width:0}.row .l{display:flex;justify-content:space-between;gap:8px;min-width:0}.row .l b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}.row .l span{color:var(--muted);white-space:nowrap}
.donut{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}.donut svg{width:150px;height:150px}
.leg{font-size:12.5px}.leg div{display:flex;align-items:center;gap:8px;margin:4px 0}.leg i{width:11px;height:11px;border-radius:3px;flex:none}.leg span{margin-left:auto;color:var(--muted)}
.tl{display:flex;align-items:flex-end;gap:4px;height:150px}.tl .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}.tl .bar{border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,var(--teal),var(--bleu))}.tl .col span{font-size:10px;color:var(--muted);height:16px;text-align:center;white-space:nowrap;overflow:visible}
footer{padding:14px 18px;color:var(--muted);font-size:12px}
.ftog{display:none}
@media(max-width:860px){.chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}.chip{flex:none}.chips .lab{flex:none}main{grid-template-columns:1fr}aside{display:none;position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}aside.open{display:block}aside .filt{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}#fiche dl{grid-template-columns:1fr}.ftog{display:inline-block}section#liste{padding:10px 10px 60px}#stats{padding:12px 10px 60px}.donut{grid-template-columns:120px 1fr}.donut svg{width:120px;height:120px}header .brand img{height:24px}}
</style>
</head>

function b64(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function ouvrir(id,pw){const r=await fetch('data.enc?v='+Date.now());const raw=b64((await r.text()).trim());const sel=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(id.trim().toLowerCase()+'\n'+pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:sel,iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
 const ds=new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(ds).text())}
document.getElementById('gform').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;b.textContent='Connexion…';const id=document.getElementById('id').value,pw=document.getElementById('pw').value;
 try{DATA=await ouvrir(id,pw);try{const st=document.getElementById('rem').checked?localStorage:sessionStorage;st.setItem('crm_id',id);st.setItem('crm_pw',pw)}catch(_){}
 document.getElementById('gate').style.display='none';init()}catch(err){document.getElementById('gerr').textContent='Identifiant ou mot de passe incorrect.';b.disabled=false;b.textContent='Se connecter'}};
(async()=>{let id='',pw='';try{id=localStorage.getItem('crm_id')||sessionStorage.getItem('crm_id')||'';pw=localStorage.getItem('crm_pw')||sessionStorage.getItem('crm_pw')||''}catch(_){}if(id&&pw){try{DATA=await ouvrir(id,pw);document.getElementById('gate').style.display='none';init()}catch(_){}}})();
function norm(s){return (s||'').toString().normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()}
function wa(t){let d=(t||'').replace(/[^\d]/g,'');if(!d)return '';if(d.startsWith('00'))d=d.slice(2);if(d.length===10&&d[0]==='0')d='225'+d;else if(d.length===8)d='225'+d;return d.length>=8?'https://wa.me/'+d:''}
function lien(u){if(!u)return '';u=u.trim();if(!/^https?:/i.test(u))u='https://'+u.replace(/^\/+/,'');return u}
function init(){for(const c of DATA.contacts){c.t=(c.t||'').replace(/^\s*(p|tel|t[ée]l[ée]phone|phone|mobile|whatsapp|wa)\s*[:.]\s*/i,'').trim();if(/^(n\.?c\.?|n\/?a|nc|-+|\.+|non|aucun[e]?|inconnu)$/i.test(c.t))c.t='';c._q=norm([c.n,c.e,c.o,c.p,c.se,c.ty,c.lo,c.vi,c.no].join(' '));c._so=c.so?c.so.split(' ; '):[];c._se=c.se||NR;c._wa=wa(c.t);c._li=lien(c.li)}
 document.getElementById('hcnt').textContent=DATA.contacts.length.toLocaleString('fr-FR')+' contacts';
 document.getElementById('foot').textContent='Généré le '+(DATA.genere||'')+' · une ligne par adresse e-mail · localisation déduite, l’indice est dans la fiche · données chiffrées, déchiffrées dans le navigateur.';
 document.getElementById('q').oninput=()=>maj();document.getElementById('tri').onchange=e=>{SORT=e.target.value;DIR=SORT==='dc'||SORT==='er'?-1:1;maj()};
 document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(SORT===k)DIR=-DIR;else{SORT=k;DIR=1}maj()});
 document.getElementById('reset').onclick=()=>{for(const k in F)F[k].clear();document.getElementById('q').value='';maj()};
 document.getElementById('more').onclick=()=>{rendre(SHOWN+200)};document.getElementById('csv').onclick=()=>csv(ROWS,'crm-mstudio-filtre.csv');document.getElementById('csvsel').onclick=()=>csv(DATA.contacts.filter(c=>SEL.has(c.e)),'crm-mstudio-lot.csv');
 document.getElementById('ckall').onchange=e=>{for(const c of ROWS.slice(0,SHOWN)){e.target.checked?SEL.add(c.e):SEL.delete(c.e)}rendre(SHOWN)};
 document.getElementById('ftog').onclick=()=>{const a=document.querySelector('aside');a.classList.toggle('open');document.getElementById('ftog').textContent=a.classList.contains('open')?'Masquer les filtres':'Filtres'};document.getElementById('fx').onclick=()=>document.getElementById('fiche').classList.remove('on');document.getElementById('out').onclick=()=>{try{for(const st of [localStorage,sessionStorage]){st.removeItem('crm_id');st.removeItem('crm_pw')}}catch(_){}location.reload()};
 document.querySelectorAll('.tabs button[data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button[data-t]').forEach(x=>x.classList.toggle('on',x===b));const t=b.dataset.t;document.getElementById('liste').style.display=t==='liste'?'':'none';document.querySelector('aside').style.display=t==='liste'?'':'none';document.getElementById('stats').style.display=t==='stats'?'block':'none';document.querySelector('main').classList.toggle('one',t==='stats');if(t==='stats')stats()});
 maj()}
function filtre(){const q=norm(document.getElementById('q').value).trim();const mots=q?q.split(/\s+/):[];
 return DATA.contacts.filter(c=>(!mots.length||mots.every(m=>c._q.includes(m)))&&(!F.so.size||c._so.some(s=>F.so.has(s)))&&(!F.ty.size||F.ty.has(c.ty))&&(!F.se.size||F.se.has(c._se))&&(!F.lo.size||F.lo.has(c.lo)))}
function maj(){ROWS=filtre();const k=SORT;ROWS.sort((a,b)=>{let x=a[k],y=b[k];if(k==='er'){x=+x||0;y=+y||0;return (x-y)*DIR}x=(x||'').toString();y=(y||'').toString();if(k==='n'){x=x.replace(/^[^\p{L}]+/u,'');y=y.replace(/^[^\p{L}]+/u,'')}if(!x&&y)return 1;if(x&&!y)return -1;return x.localeCompare(y,'fr')*DIR});
 document.getElementById('cnt').textContent=ROWS.length.toLocaleString('fr-FR')+' contact'+(ROWS.length>1?'s':'');facettes();chips();rendre(200)}
function pool(k){const q=norm(document.getElementById('q').value).trim();const mots=q?q.split(/\s+/):[];return DATA.contacts.filter(c=>(!mots.length||mots.every(m=>c._q.includes(m)))&&(k==='so'||!F.so.size||c._so.some(s=>F.so.has(s)))&&(k==='ty'||!F.ty.size||F.ty.has(c.ty))&&(k==='se'||!F.se.size||F.se.has(c._se))&&(k==='lo'||!F.lo.size||F.lo.has(c.lo)))}
function compte(k){const cnt=new Map();for(const c of pool(k)){const vs=k==='so'?c._so:[k==='se'?c._se:c[k]];for(const v of vs)cnt.set(v,(cnt.get(v)||0)+1)}for(const v of F[k])if(!cnt.has(v))cnt.set(v,0);return [...cnt.entries()].sort((a,b)=>b[1]-a[1])}
function facettes(){for(const k of ['ty','se','lo','so']){const items=compte(k).slice(0,k==='lo'?18:40);const el=document.getElementById('f-'+k);
 el.innerHTML='<h3>'+LAB[k]+'</h3>'+items.map(([v,n])=>'<label><input type="checkbox" '+(F[k].has(v)?'checked':'')+' data-k="'+k+'" data-v="'+esc(v)+'"><span>'+esc(v)+'</span><span class="n">'+n.toLocaleString('fr-FR')+'</span></label>').join('');
 el.querySelectorAll('input').forEach(i=>i.onchange=()=>{const s=F[i.dataset.k];i.checked?s.add(i.dataset.v):s.delete(i.dataset.v);maj()})}}
function chips(){const el=document.getElementById('chips');const FIN=new Set(['Non renseigné','À qualifier']);const items=compte('ty').filter(x=>x[1]>0||F.ty.has(x[0])).sort((a,b)=>(FIN.has(a[0])-FIN.has(b[0]))||(b[1]-a[1]));
 el.innerHTML='<span class="lab">Type de contact</span>'+items.map(([v,n])=>'<button class="chip'+(F.ty.has(v)?' on':'')+'" data-v="'+esc(v)+'">'+esc(v)+' <b>'+n.toLocaleString('fr-FR')+'</b></button>').join('');
 el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const v=b.dataset.v;F.ty.has(v)?F.ty.delete(v):F.ty.add(v);maj()})}
function ini(c){const t=(c.n||c.e||'').replace(/^[^\p{L}]+/u,'').trim();const m=t.split(/[\s.]+/).filter(Boolean);return m.length>1?(m[0][0]+m[m.length-1][0]).toUpperCase():t.slice(0,2).toUpperCase()}
function coul(c){let h=0;for(const ch of (c.e||''))h=(h*31+ch.charCodeAt(0))>>>0;const g=[['#2ECFBE','#2563EB'],['#2563EB','#1B2B6B'],['#4DA6D8','#2ECFBE'],['#7C3AED','#2563EB'],['#12A697','#4DA6D8']][h%5];return 'linear-gradient(135deg,'+g[0]+','+g[1]+')'}
function esc(s){return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function rendre(n){SHOWN=Math.min(n,ROWS.length);const tb=document.getElementById('tb');tb.innerHTML=ROWS.slice(0,SHOWN).map((c,i)=>'<tr data-i="'+i+'"'+(SEL.has(c.e)?' class="sel"':'')+'><td class="ck"><input type="checkbox" data-e="'+esc(c.e)+'"'+(SEL.has(c.e)?' checked':'')+'></td><td title="'+esc(c.n)+'"><span class="av s" style="background:'+coul(c)+'">'+ini(c)+'</span><b>'+esc(c.n||'')+'</b></td><td class="mail"><a href="mailto:'+esc(c.e)+'">'+esc(c.e)+'</a></td><td>'+(c._wa?'<a class="pill wa" href="'+esc(c._wa)+'" target="_blank" rel="noopener">'+IWA+esc(c.t)+'</a>':esc(c.t))+'</td><td>'+(c._li?'<a class="pill li" href="'+esc(c._li)+'" target="_blank" rel="noopener">'+ILI+'Profil</a>':'')+'</td><td title="'+esc(c.o)+'">'+esc(c.o)+'</td><td title="'+esc(c.p)+'">'+esc(c.p)+'</td><td><span class="tag">'+esc(c.ty)+'</span></td><td>'+esc(c.se)+'</td><td>'+esc(c.lo)+'</td><td>'+c._so.map(s=>'<span class="tag src">'+esc(s)+'</span>').join('')+'</td><td>'+esc(c.dc)+'</td></tr>').join('');
 tb.querySelectorAll('tr').forEach(tr=>{tr.onclick=e=>{if(e.target.closest('a')||e.target.closest('input'))return;fiche(ROWS[+tr.dataset.i])};const ck=tr.querySelector('input');ck.onchange=()=>{ck.checked?SEL.add(ck.dataset.e):SEL.delete(ck.dataset.e);tr.classList.toggle('sel',ck.checked);selmaj()}});
 selmaj();document.getElementById('more').style.display=SHOWN<ROWS.length?'block':'none';document.getElementById('more').textContent='Afficher plus ('+SHOWN+' / '+ROWS.length.toLocaleString('fr-FR')+')'}
function selmaj(){const b=document.getElementById('csvsel');b.disabled=!SEL.size;b.textContent='Télécharger les cochés ('+SEL.size+')'}
function fiche(c){const d=[['E-mail','<a href="mailto:'+esc(c.e)+'">'+esc(c.e)+'</a>'],['WhatsApp',c._wa?'<a href="'+esc(c._wa)+'" target="_blank" rel="noopener">'+esc(c.t)+'</a>':esc(c.t)],['LinkedIn',c._li?'<a href="'+esc(c._li)+'" target="_blank" rel="noopener">'+esc(c.li.replace(/^https?:\/\/(www\.)?/,''))+'</a>':''],['Organisation',esc(c.o)],['Poste',esc(c.p)],['Type de contact','<span class="tag">'+esc(c.ty)+'</span> <small style="color:var(--muted)">confiance '+esc(c.cf)+'</small>'],['Secteur',esc(c._se)],['Localisation',esc(c.lo)+(c.vi?' · '+esc(c.vi):'')+'<br><small style="color:var(--muted)">d’après : '+esc(c.lb)+'</small>'],['Sources',c._so.map(s=>'<span class="tag src">'+esc(s)+'</span>').join('')],['E-mails échangés',(c.er!==''||c.ee!=='')?(c.er||0)+' reçu(s), '+(c.ee||0)+' envoyé(s)':''],['Premier / dernier contact',esc(c.pc)+' → '+esc(c.dc)],['Note',esc(c.no)]].filter(x=>x[1]);
 const cls=s=>/luma/i.test(s)?'luma':/pj/i.test(s)?'pj':/gmail/i.test(s)?'gmail':'drive';
 const tr=(c.tr||[]).slice().sort((a,b)=>(b.d||'').localeCompare(a.d||''));
 const traces=tr.map(t=>'<li class="'+cls(t.s)+'"><span class="d">'+esc(t.d||'date inconnue')+' · '+esc(t.s)+'</span><span class="t">'+(t.l?'<a href="'+esc(t.l)+'" target="_blank" rel="noopener">'+esc(t.t)+'</a>':esc(t.t))+(t.st?'<span class="st">'+esc(t.st)+'</span>':'')+'</span></li>').join('');
 const act='<div class="actions"><a class="m" href="mailto:'+esc(c.e)+'">'+IMA+'Écrire</a>'+(c._wa?'<a class="w" href="'+esc(c._wa)+'" target="_blank" rel="noopener">'+IWA+'WhatsApp</a>':'')+(c._li?'<a class="l" href="'+esc(c._li)+'" target="_blank" rel="noopener">'+ILI+'LinkedIn</a>':'')+'</div>';
 document.getElementById('fc').innerHTML='<div class="head"><span class="av" style="background:'+coul(c)+'">'+ini(c)+'</span><div><h2>'+esc(c.n||c.e)+'</h2><div class="sub" style="margin:0">'+esc([c.p,c.o].filter(Boolean).join(' · '))+'</div></div></div>'+act+'<div class="card"><dl>'+d.map(x=>'<dt>'+x[0]+'</dt><dd>'+x[1]+'</dd>').join('')+'</dl></div><h3 class="sec">Historique · '+tr.length+' trace'+(tr.length>1?'s':'')+'</h3><ul class="hist">'+traces+'</ul>';
 document.getElementById('fiche').classList.add('on');document.getElementById('fiche').scrollTop=0}
function csv(rows,nom){const cols=[['Nom','n'],['E-mail','e'],['WhatsApp','t'],['LinkedIn','li'],['Organisation','o'],['Poste','p'],['Type de contact','ty'],['Secteur','se'],['Localisation','lo'],["Localisation, d'après",'lb'],['Ville','vi'],['Sources','so'],['Détail des sources','ds'],['E-mails reçus','er'],['E-mails envoyés','ee'],['Premier contact','pc'],['Dernier contact','dc'],['Note','no']];
 const q=v=>'"'+(v===undefined||v===null?'':v).toString().replace(/"/g,'""')+'"';const lignes=[cols.map(c=>q(c[0])).join(';')].concat(rows.map(r=>cols.map(c=>q(c[1]==='ds'?(r.tr||[]).map(t=>t.s+' · '+t.t+(t.st?' ('+t.st+')':'')).join(' ; '):r[c[1]])).join(';')));
 const blob=new Blob(['﻿'+lignes.join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nom;a.click()}
const PAL=['#2ECFBE','#2563EB','#4DA6D8','#1B2B6B','#7C3AED','#F59E0B','#EC4899','#10B981','#F97316','#0EA5E9','#8B5CF6','#14B8A6'];
function donut(items,total){let off=0;const R=42,C=2*Math.PI*R;const segs=items.map(([v,n],i)=>{const f=n/total,d=f*C;const s='<circle r="'+R+'" cx="60" cy="60" fill="none" stroke="'+(v===NR?'#C9D2E0':PAL[i%PAL.length])+'" stroke-width="18" stroke-dasharray="'+d+' '+(C-d)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 60 60)"/>';off+=d;return s}).join('');
 return '<div class="donut"><svg viewBox="0 0 120 120">'+segs+'<text x="60" y="57" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2B6B">'+(total>=1000?Math.round(total/1000)+' k':total)+'</text><text x="60" y="71" text-anchor="middle" font-size="8" fill="#6B7A99">contacts</text></svg><div class="leg">'+items.map(([v,n],i)=>'<div><i style="background:'+(v===NR?'#C9D2E0':PAL[i%PAL.length])+'"></i>'+esc(v)+'<span>'+Math.round(100*n/total)+' %</span></div>').join('')+'</div></div>'}
function barres(items,max){const top=items.slice(0,max).map(([v,n])=>[v.length>70?v.slice(0,68)+'…':v,n]);const mx=top.find(x=>x[0]!==NR)?top.find(x=>x[0]!==NR)[1]:1;return top.map(([v,n])=>'<div class="row"><div class="l"><b>'+esc(v)+'</b><span>'+n.toLocaleString('fr-FR')+'</span></div><div class="b"><i class="'+(v===NR?'g':'')+'" style="width:'+Math.min(100,100*n/mx)+'%"></i></div></div>').join('')}
function timeline(C){const m=new Map();for(const c of C){const d=(c.dc||'').slice(0,7);if(/^\d{4}-\d{2}$/.test(d))m.set(d,(m.get(d)||0)+1)}const ks=[...m.keys()].sort().slice(-24);if(!ks.length)return '';const mx=Math.max(...ks.map(k=>m.get(k)));
 return '<div class="tl">'+ks.map((k,i)=>'<div class="col" title="'+k+' : '+m.get(k).toLocaleString('fr-FR')+'"><div class="bar" style="height:'+Math.max(2,100*m.get(k)/mx)+'%"></div><span>'+(i%3===0?k.slice(2).replace('-','/'):'')+'</span></div>').join('')+'</div>'}
function stats(){const S=document.getElementById('stats');const C=ROWS.length&&ROWS.length!==DATA.contacts.length?ROWS:DATA.contacts;const cnt=(f)=>{const m=new Map();for(const c of C){for(const v of f(c))m.set(v,(m.get(v)||0)+1)}return [...m.entries()].sort((a,b)=>b[1]-a[1])};
 const orgs=new Map();for(const c of C){if(!c.o)continue;const k=norm(c.o).replace(/[^a-z0-9]/g,'');const e=orgs.get(k)||{n:0,g:new Map()};e.n++;e.g.set(c.o,(e.g.get(c.o)||0)+1);orgs.set(k,e)}const topOrg=[...orgs.values()].map(e=>[[...e.g.entries()].sort((a,b)=>b[1]-a[1])[0][0],e.n]).sort((a,b)=>b[1]-a[1]);const nbOrg=orgs.size,nWa=C.filter(c=>c._wa).length,nLi=C.filter(c=>c._li).length,nOrg=C.filter(c=>c.o).length;const src=cnt(c=>c._so);const pc=n=>Math.round(100*n/C.length)+' %';
 const ty=cnt(c=>[c.ty]);const tyTop=ty.slice(0,8);const reste=ty.slice(8).reduce((a,x)=>a+x[1],0);if(reste)tyTop.push(['Autres types',reste]);
 const fin=cnt(c=>[c._se]).filter(x=>/Banque|Microfinance|Assurance|Fintech|Investissement|Bailleur/.test(x[0]));
 S.innerHTML='<div class="kpi"><div class="card"><b>'+C.length.toLocaleString('fr-FR')+'</b><span>contacts'+(C!==DATA.contacts?' (filtre en cours)':'')+'</span></div><div class="card"><b>'+nbOrg.toLocaleString('fr-FR')+'</b><span>organisations distinctes</span></div><div class="card light"><b>'+pc(nOrg)+'</b><span>avec une organisation connue</span></div><div class="card light"><b>'+pc(nWa)+'</b><span>joignables sur WhatsApp · '+nWa.toLocaleString('fr-FR')+'</span></div><div class="card light"><b>'+pc(nLi)+'</b><span>avec un profil LinkedIn · '+nLi.toLocaleString('fr-FR')+'</span></div></div>'
 +'<div class="g"><div class="card"><h3>Types de contact</h3>'+donut(tyTop,C.length)+'</div><div class="card"><h3>Sources</h3><div class="sub">un contact peut venir de plusieurs sources</div>'+barres(src,8)+'</div><div class="card"><h3>Finance</h3><div class="sub">banques, microfinance, assurance, fintech, fonds, bailleurs</div>'+barres(fin,8)+'</div><div class="card"><h3>Secteurs</h3>'+barres(cnt(c=>[c._se]),14)+'</div><div class="card"><h3>Localisation</h3>'+barres(cnt(c=>[c.lo]),12)+'</div><div class="card"><h3>Organisations les plus représentées</h3>'+barres(topOrg,15)+'</div><div class="card" style="grid-column:1/-1"><h3>Derniers contacts par mois</h3><div class="sub">date de la trace la plus récente de chaque contact, 24 derniers mois</div>'+timeline(C)+'</div></div>'}
</script>
